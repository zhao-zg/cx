name: 测试 Cloudflare 配置

on:
  workflow_dispatch:  # 手动触发

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Job 0: 自动探测已配置的账户，生成 matrix
  # ────────────────────────────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: 生成 matrix
        id: detect
        run: |
          MATRIX='{"target":['
          for i in $(seq 1 20); do
            if [ $i -gt 1 ]; then MATRIX="$MATRIX,"; fi
            MATRIX="${MATRIX}{\"account\":\"$i\",\"label\":\"账户#$i\"}"
          done
          MATRIX="$MATRIX]}"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  # ────────────────────────────────────────────────────────────────────────
  # Job 1: 逐账户测试（未配置的自动跳过）
  # ────────────────────────────────────────────────────────────────────────
  test-config:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: 检查 Secrets 是否配置（账户 #${{ matrix.target.account }}）
        id: check
        env:
          CF_TOKEN: ${{ secrets[format('CLOUDFLARE_API_TOKEN_{0}', matrix.target.account)] }}
          CF_ACCT: ${{ secrets[format('CLOUDFLARE_ACCOUNT_ID_{0}', matrix.target.account)] }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCT" ]; then
            echo "⏭️  账户 #${{ matrix.target.account }} 未配置，跳过"
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "✓ 账户 #${{ matrix.target.account }} 已配置"
            echo "  Account ID (前8位): ${CF_ACCT:0:8}..."
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: 测试 Cloudflare API（账户 #${{ matrix.target.account }}）
        if: steps.check.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets[format('CLOUDFLARE_API_TOKEN_{0}', matrix.target.account)] }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets[format('CLOUDFLARE_ACCOUNT_ID_{0}', matrix.target.account)] }}
        run: |
          echo "测试 Cloudflare API 连接 — 账户 #${{ matrix.target.account }}..."
          echo ""

          # 列出所有 Pages 项目
          response=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")

          # 分离响应体和状态码
          http_code=$(echo "$response" | grep "HTTP_CODE:" | cut -d: -f2)
          body=$(echo "$response" | sed '/HTTP_CODE:/d')

          echo "HTTP 状态码: $http_code"
          echo ""
          echo "API 响应:"
          echo "$body" | jq '.' || echo "$body"
          echo ""

          # 检查是否成功
          success=$(echo "$body" | jq -r '.success' 2>/dev/null || echo "false")
          if [ "$success" = "true" ]; then
            echo "✅ API 连接成功"

            # 列出所有项目名称
            echo ""
            echo "📋 Pages 项目列表:"
            projects=$(echo "$body" | jq -r '.result[].name' 2>/dev/null)
            if [ -z "$projects" ]; then
              echo "  (没有找到任何项目)"
            else
              echo "$projects" | while read -r project; do
                echo "  - $project"
              done
            fi

            # 检查 cx 项目是否存在
            echo ""
            project_exists=$(echo "$body" | jq -r '.result[] | select(.name=="cx") | .name' 2>/dev/null)
            if [ -n "$project_exists" ]; then
              echo "✅ 找到项目: cx"
            else
              echo "❌ 未找到项目: cx（首次部署时会自动创建）"
            fi
          else
            echo "❌ API 连接失败"
            echo ""
            echo "错误信息:"
            echo "$body" | jq -r '.errors[]' 2>/dev/null || echo "$body"
            echo ""
            echo "可能的原因:"
            echo "1. Account ID 不正确"
            echo "2. API Token 无效或已过期"
            echo "3. API Token 权限不足（需要 'Cloudflare Pages - Edit'）"
          fi
