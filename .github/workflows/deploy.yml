name: 构建并部署到 Cloudflare Pages 和 GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'resource/**'
      - 'src/generator.py'
      - 'src/models.py'
      - 'src/parser.py'
      - 'src/parser_improved.py'
      - 'src/templates/base.html'
      - 'src/templates/index.html'
      - 'src/templates/main_*.html'
      - 'src/templates/main_*.js'
      - 'src/templates/main_*.json'
      - 'src/templates/morning_revival.html'
      - 'src/templates/outline.html'
      - 'src/templates/scripture.html'
      - 'src/templates/details.html'
      - 'src/templates/hymn.html'
      - 'src/templates/message.html'
      - 'src/templates/ministry.html'
      - 'src/templates/page_navigation.html'
      - 'src/templates/motto.html'
      - 'src/templates/motto_song.html'
      - 'src/static/**'
      - 'main.py'
      - 'config.yaml'
      - 'app_config.json'
      - 'generate_version.py'
  workflow_dispatch:

# ════════════════════════════════════════════════════════════════════════
# 多 Cloudflare 账户容灾部署 — 全自动
# ════════════════════════════════════════════════════════════════════════
# 新增账户只需 2 步，YAML 完全不用改：
#   1. 在 Cloudflare 新账户下创建 Pages 项目（名称 cx）
#   2. 在 GitHub repo Settings → Secrets 添加：
#      CLOUDFLARE_ACCOUNT_ID_{N}  和  CLOUDFLARE_API_TOKEN_{N}
#
# prepare job 会自动探测所有已配置的 CLOUDFLARE_ACCOUNT_ID_{1..20}，
# 只把已配置的账户加入 matrix，未配置的自动跳过。
# ════════════════════════════════════════════════════════════════════════

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Job 0: 自动探测已配置的 Cloudflare 账户，生成 matrix
  # ────────────────────────────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: 探测已配置的 Cloudflare 账户
        id: detect
        run: |
          echo "🔍 自动探测已配置的 Cloudflare 账户..."
          ACCOUNTS=""

          for i in $(seq 1 20); do
            # 通过 GitHub Actions 变量间接检测：未设置的 secret 为空字符串
            eval "ACCOUNT_ID=\${{ secrets.CLOUDFLARE_ACCOUNT_ID_$i }}" 2>/dev/null || true
            # 用 env 间接方式无法在 step 外检测，改用 hasSecret trick：
            # 这里用 format 拼接 + 判空来检测
            TOKEN_VAR="CLOUDFLARE_API_TOKEN_$i"
            ACCT_VAR="CLOUDFLARE_ACCOUNT_ID_$i"
            
            # 使用 GitHub Actions 表达式检测（通过 GITHUB_OUTPUT 传递）
            # 由于 shell 无法直接读 secrets，我们输出索引号让后续 job 判空
            # 简单做法：固定扫描 1-20，deploy job 内判空跳过
            ACCOUNTS="$ACCOUNTS {\"account\":\"$i\",\"label\":\"账户#$i\"},"
          done

          # 构建包含所有 1-20 的 matrix，deploy job 会跳过未配置的
          # 这样完全不需要改 YAML
          echo "📋 生成 matrix（1-20，未配置的会在部署时跳过）"
          MATRIX='{"target":['
          for i in $(seq 1 20); do
            if [ $i -gt 1 ]; then MATRIX="$MATRIX,"; fi
            MATRIX="${MATRIX}{\"account\":\"$i\",\"label\":\"账户#$i\"}"
          done
          MATRIX="$MATRIX]}"

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "✓ matrix 已生成"

  # ────────────────────────────────────────────────────────────────────────
  # Job 1: 构建（只执行一次，产出共享给所有部署 job）
  # ────────────────────────────────────────────────────────────────────────
  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit-hash: ${{ steps.meta.outputs.commit-hash }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装混淆工具
        run: |
          npm install -g javascript-obfuscator
          echo "✓ javascript-obfuscator 已安装"

      - name: 安装 LibreOffice
        run: |
          echo "📦 安装 LibreOffice..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer libreoffice-core --no-install-recommends
          echo "✓ LibreOffice 已安装"

      - name: 安装 Python 依赖
        run: |
          echo "📦 安装 Python 依赖..."
          pip install -r requirements.txt

      - name: 生成静态文件
        run: |
          echo "🔨 生成静态文件..."
          python main.py

          echo "📋 检查生成的文件..."
          ls -la output/js/

          echo "📄 检查 version.json 是否存在..."
          if [ -f output/version.json ]; then
            echo "✓ version.json 文件存在"
            echo "内容预览:"
            cat output/version.json | head -20
          else
            echo "⚠️ version.json 文件不存在"
          fi

          echo "📄 检查 sw.js 是否存在..."
          if [ -f output/sw.js ]; then
            echo "✓ sw.js 文件存在"
            echo "文件大小: $(wc -c < output/sw.js) bytes"
            echo "前 5 行内容:"
            head -5 output/sw.js
          else
            echo "❌ sw.js 文件不存在！"
            exit 1
          fi

      - name: 从 GitHub Release 下载 APK
        run: |
          echo "🔍 从 GitHub Release 获取最新 APK..."

          # 获取最新 Release 信息
          RELEASE_INFO=$(curl -sf "https://api.github.com/repos/zhao-zg/cx/releases/latest" || echo "{}")

          if [ "$RELEASE_INFO" = "{}" ]; then
            echo "ℹ️ 没有找到 Release"
            exit 0
          fi

          # 提取 APK 信息
          APK_URL=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url // empty')
          APK_NAME=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | endswith(".apk")) | .name // empty')
          APK_SIZE=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | endswith(".apk")) | .size // empty')
          APK_VERSION=$(echo "$RELEASE_INFO" | jq -r '.tag_name // empty' | sed 's/^v//')

          if [ -n "$APK_URL" ] && [ "$APK_URL" != "null" ]; then
            echo "📥 下载 APK: $APK_NAME"
            echo "   版本: $APK_VERSION"
            echo "   大小: $APK_SIZE bytes"
            echo "   URL: $APK_URL"

            if curl -sfL -o "output/$APK_NAME" "$APK_URL"; then
              DOWNLOADED_SIZE=$(stat -c%s "output/$APK_NAME" 2>/dev/null || echo "0")
              echo "✓ APK 下载成功: $APK_NAME ($DOWNLOADED_SIZE bytes)"

              # 更新 version.json 添加 APK 信息
              if [ -f output/version.json ]; then
                python3 << PYTHON_EOF
          import json

          with open('output/version.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          data['apk_file'] = '$APK_NAME'
          data['apk_version'] = '$APK_VERSION'
          data['apk_size'] = $DOWNLOADED_SIZE

          with open('output/version.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print('✓ version.json 已更新')
          print(f'  APK: $APK_NAME')
          print(f'  版本: $APK_VERSION')
          print(f'  大小: $DOWNLOADED_SIZE bytes')
          PYTHON_EOF
              fi
            else
              echo "⚠️ APK 下载失败"
            fi
          else
            echo "ℹ️ Release 中没有 APK 文件"
          fi

      - name: 记录构建元信息
        id: meta
        run: |
          echo "commit-hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: output/
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────
  # Job 2: 部署到 Cloudflare Pages（多账户 matrix 并行，自动跳过未配置的）
  # ────────────────────────────────────────────────────────────────────────
  deploy-cloudflare:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
      max-parallel: 4

    steps:
      - name: 检查 Secrets 是否配置（账户 #${{ matrix.target.account }}）
        id: check
        env:
          CF_TOKEN: ${{ secrets[format('CLOUDFLARE_API_TOKEN_{0}', matrix.target.account)] }}
          CF_ACCT: ${{ secrets[format('CLOUDFLARE_ACCOUNT_ID_{0}', matrix.target.account)] }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCT" ]; then
            echo "⏭️  账户 #${{ matrix.target.account }} 未配置 Secrets，自动跳过"
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "✓ 账户 #${{ matrix.target.account }} Secrets 已配置"
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: 下载构建产物
        if: steps.check.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: output/

      - name: 部署到 Cloudflare Pages（账户 #${{ matrix.target.account }}）
        if: steps.check.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets[format('CLOUDFLARE_API_TOKEN_{0}', matrix.target.account)] }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets[format('CLOUDFLARE_ACCOUNT_ID_{0}', matrix.target.account)] }}
        run: |
          ACCOUNT_SUFFIX="${{ matrix.target.account }}"
          echo "🚀 部署到 Cloudflare Pages — 账户 #${ACCOUNT_SUFFIX}"
          echo "  Account ID (前8位): ${CLOUDFLARE_ACCOUNT_ID:0:8}..."

          # 检查并创建 Pages 项目
          echo "🔍 检查项目 cx 是否存在..."
          response=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/cx" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")

          success=$(echo "$response" | jq -r '.success')

          if [ "$success" = "true" ]; then
            echo "✓ 项目 cx 已存在"
          else
            echo "📦 项目不存在，正在创建..."
            create_response=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{
                "name": "cx",
                "production_branch": "main"
              }')

            create_success=$(echo "$create_response" | jq -r '.success')

            if [ "$create_success" = "true" ]; then
              echo "✓ 项目 cx 创建成功"
            else
              echo "❌ 项目创建失败"
              echo "$create_response" | jq '.'
              exit 1
            fi
          fi

          # 安装 wrangler
          npm install -g wrangler

          # 获取 commit 信息
          COMMIT_HASH="${{ needs.build.outputs.commit-hash }}"
          COMMIT_MSG="Deploy ${COMMIT_HASH} to account#${ACCOUNT_SUFFIX}"

          # 部署（带重试机制）
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = "false" ]; do
            if [ $RETRY_COUNT -gt 0 ]; then
              echo "⏳ 等待 30 秒后重试..."
              sleep 30
              echo "🔄 重试第 $RETRY_COUNT 次..."
            fi

            if wrangler pages deploy output \
              --project-name=cx \
              --branch=main \
              --commit-hash="$COMMIT_HASH" \
              --commit-message="$COMMIT_MSG"; then
              SUCCESS=true
              echo "✓ Cloudflare Pages 部署成功 — 账户 #${ACCOUNT_SUFFIX}"
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "⚠️ 部署失败，准备重试 ($RETRY_COUNT/$MAX_RETRIES)"
              else
                echo "❌ 部署失败，已达到最大重试次数 — 账户 #${ACCOUNT_SUFFIX}"
                exit 1
              fi
            fi
          done

  # ────────────────────────────────────────────────────────────────────────
  # Job 3: 汇总部署结果
  # ────────────────────────────────────────────────────────────────────────
  deploy-summary:
    needs: deploy-cloudflare
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 汇总部署结果
        run: |
          echo "═══════════════════════════════════════════════"
          echo "         Cloudflare Pages 多账户部署结果"
          echo "═══════════════════════════════════════════════"
          echo ""

          RESULT="${{ needs.deploy-cloudflare.result }}"

          if [ "$RESULT" = "success" ]; then
            echo "✅ 所有账户部署成功"
          elif [ "$RESULT" = "failure" ]; then
            echo "⚠️ 部分账户部署失败，请检查上方日志"
            echo ""
            echo "失败不影响其他账户，已部署的账户仍可正常访问"
          else
            echo "❓ 部署状态异常: $RESULT"
          fi

          echo ""
          echo "═══════════════════════════════════════════════"

  # ────────────────────────────────────────────────────────────────────────
  # Job 4: 部署到 GitHub Pages + 上传 Artifacts
  # ────────────────────────────────────────────────────────────────────────
  deploy-github-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: output/

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: '部署到 GitHub Pages'
          cname: cx.xzdjx.dynv6.net

      - name: 上传全量资源包到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resource-package
          path: output/*.zip
          retention-days: 90
          if-no-files-found: warn
